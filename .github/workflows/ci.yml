name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy app

      - name: Bandit
        run: uv run bandit -q -r app

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: silpo-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      # Assumes the deploy role via OIDC — no long-lived AWS keys stored in GitHub. The role
      # ARN, ECR repo URL, and ECS cluster/service names come from silpo-iac's api unit
      # outputs; set them as repository variables (Settings > Secrets and variables > Actions
      # > Variables).
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-2

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ vars.AWS_ECR_REPOSITORY_URL }}:latest
            ${{ vars.AWS_ECR_REPOSITORY_URL }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # One-off ECS tasks with the image just pushed, in order: migrations, the app's reference
      # data (activities, good practices and achievements — never users) and the achievement
      # backfill, which grants already-earned achievements to existing users without alerts.
      # All idempotent, so they run on every deploy; any failure stops before the redeploy.
      - name: Run migrations, reference data and achievement backfill
        run: |
          set -euo pipefail
          CLUSTER="${{ vars.AWS_ECS_CLUSTER }}"
          SERVICE="${{ vars.AWS_ECS_SERVICE }}"

          SERVICE_JSON=$(aws ecs describe-services --cluster "$CLUSTER" --services "$SERVICE" \
            --query 'services[0]' --output json)
          TASK_DEF=$(jq -r '.taskDefinition' <<< "$SERVICE_JSON")
          CONTAINER=$(aws ecs describe-task-definition --task-definition "$TASK_DEF" \
            --query 'taskDefinition.containerDefinitions[0].name' --output text)

          RUN_ARGS=(--cluster "$CLUSTER" --task-definition "$TASK_DEF")
          if [ "$(jq -r '.networkConfiguration // empty' <<< "$SERVICE_JSON")" != "" ]; then
            RUN_ARGS+=(--network-configuration "$(jq -c '.networkConfiguration' <<< "$SERVICE_JSON")")
          fi
          if [ "$(jq -r '.capacityProviderStrategy // [] | length' <<< "$SERVICE_JSON")" != "0" ]; then
            RUN_ARGS+=(--capacity-provider-strategy "$(jq -c '.capacityProviderStrategy' <<< "$SERVICE_JSON")")
          else
            RUN_ARGS+=(--launch-type "$(jq -r '.launchType // "FARGATE"' <<< "$SERVICE_JSON")")
          fi

          # run_task <label> <command as JSON array>: runs the container with that command and
          # fails the job if the task doesn't exit with 0.
          run_task() {
            local label="$1" command="$2"
            local overrides task_arn task_json exit_code
            overrides=$(jq -nc --arg name "$CONTAINER" --argjson cmd "$command" \
              '{containerOverrides: [{name: $name, command: $cmd}]}')

            task_arn=$(aws ecs run-task "${RUN_ARGS[@]}" --started-by "gha-$label" \
              --overrides "$overrides" --query 'tasks[0].taskArn' --output text)
            if [ -z "$task_arn" ] || [ "$task_arn" = "None" ]; then
              echo "::error::Failed to start the $label task"
              exit 1
            fi
            echo "$label task: $task_arn"

            aws ecs wait tasks-stopped --cluster "$CLUSTER" --tasks "$task_arn"

            task_json=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$task_arn" \
              --query 'tasks[0]' --output json)
            exit_code=$(jq -r --arg name "$CONTAINER" \
              '.containers[] | select(.name == $name) | .exitCode // "none"' <<< "$task_json")
            if [ "$exit_code" != "0" ]; then
              echo "::error::$label failed (exit code: $exit_code, reason: $(jq -r '.stoppedReason' <<< "$task_json")). Check the task's logs in CloudWatch."
              exit 1
            fi
            echo "$label finished successfully."
          }

          run_task migrations '["alembic", "upgrade", "head"]'
          run_task reference-data '["python", "-m", "scripts.seed", "--defaults-only"]'
          run_task achievement-backfill '["python", "-m", "scripts.backfill_achievements"]'

      # The ECS task definition always points at the ":latest" tag, so a plain image push
      # doesn't change what's running — the service has to be told to redeploy explicitly.
      - name: Force new ECS deployment
        run: |
          aws ecs update-service \
            --cluster "${{ vars.AWS_ECS_CLUSTER }}" \
            --service "${{ vars.AWS_ECS_SERVICE }}" \
            --force-new-deployment

      - name: Wait for service to stabilize
        run: |
          aws ecs wait services-stable \
            --cluster "${{ vars.AWS_ECS_CLUSTER }}" \
            --service "${{ vars.AWS_ECS_SERVICE }}"

  mirror-gitlab:
    name: Mirror to GitLab
    runs-on: ubuntu-latest
    needs: [lint, test, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push main to GitLab mirror
        env:
          GITLAB_MIRROR_TOKEN: ${{ secrets.GITLAB_MIRROR_TOKEN }}
        run: |
          git push "https://oauth2:${GITLAB_MIRROR_TOKEN}@tools.ages.pucrs.br/2026-2/3jk-5jk/silpo/silpo-backend.git" HEAD:main
