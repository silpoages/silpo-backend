<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>$title · Silpo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Tokens copied from silpo-mobile/src/theme so this page looks like the app. */
      :root {
        --background: #f6f8f3;
        --surface: #ffffff;
        --surface-tint: #e3f0e7;
        --text: #1f3329;
        --text-secondary: #55685d;
        --text-muted: #9aaaa0;
        --primary: #3f6b57;
        --border: #dee8df;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        background: var(--background);
        color: var(--text);
        font-family: 'Nunito', system-ui, -apple-system, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      main {
        width: 100%;
        max-width: 420px;
        min-height: 100vh;
        padding: 32px 24px 24px;
        display: flex;
        flex-direction: column;
      }

      .brand {
        margin: 0;
        color: var(--primary);
        font-size: 26px;
        font-weight: 400;
        text-align: center;
      }

      /* Anchored near the top instead of centered, so the message doesn't float in the middle of
         tall desktop windows; the top gap still grows a little with the viewport height. */
      .content {
        flex-grow: 1;
        display: flex;
        flex-direction: column;
        padding: clamp(32px, 8vh, 72px) 0 32px;
      }

      .badge {
        width: 64px;
        height: 64px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .badge--confirmed {
        background: var(--primary);
        border-radius: 999px;
      }

      .badge--invalid {
        background: var(--surface-tint);
        border-radius: 20px;
      }

      h1 {
        margin: 24px 0 0;
        font-size: 24px;
        font-weight: 800;
        line-height: 1.36;
      }

      .subtitle {
        margin: 12px 0 0;
        color: var(--text-secondary);
        font-size: 15px;
        line-height: 1.36;
      }

      .card {
        margin-top: 24px;
        padding: 16px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 14px;
        color: var(--text-secondary);
        font-size: 14px;
        line-height: 1.36;
      }

      .card strong {
        color: var(--text);
        font-weight: 800;
      }

      .footnote {
        margin: 0;
        color: var(--text-muted);
        font-size: 12px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="brand">Silpo</p>
      <section class="content" aria-labelledby="title">
        $badge
        <h1 id="title">$title</h1>
        <p class="subtitle">$message</p>
        <div class="card">$hint</div>
      </section>
      <p class="footnote">Seus dados são privados e ficam com você.</p>
    </main>
  </body>
</html>
